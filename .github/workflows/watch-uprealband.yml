name: Watch Uprealband Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IEB archive
        uses: actions/checkout@v4

      - name: Fetch Uprealband sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest/tmp ingest/candidates

          curl -L --fail --silent --show-error \
            "https://www.uprealband.com/feeds/posts/default?alt=json&max-results=50" \
            -o ingest/tmp/uprealband-blog-feed.json

          curl -L --fail --silent --show-error \
            "https://raw.githubusercontent.com/uprealband/perjalanan-band-indie/main/archive-index.json" \
            -o ingest/tmp/uprealband-archive-index.json

          curl -L --fail --silent --show-error \
            "https://api.github.com/repos/uprealband/perjalanan-band-indie/commits/main" \
            -H "Accept: application/vnd.github+json" \
            -o ingest/tmp/uprealband-github-head.json

      - name: Detect relevant IEB references
        shell: python
        run: |
          import json, pathlib, re

          root = pathlib.Path("ingest/tmp")
          candidates = []

          feed = json.loads((root / "uprealband-blog-feed.json").read_text(encoding="utf-8"))
          terms = re.compile(
              r"(infoeventband|infoeventband\.com|\bieb\b|reflexion|brebeg|"
              r"brebeg online radio|jus brebeg|nc media radio|unity music)",
              re.IGNORECASE
          )

          for entry in feed.get("feed", {}).get("entry", []):
              raw = json.dumps(entry, ensure_ascii=False)
              if terms.search(raw):
                  candidates.append({
                      "candidate_type": "blog_post",
                      "source_url": next(
                          (x.get("href") for x in entry.get("link", [])
                           if x.get("rel") == "alternate"),
                          None
                      ),
                      "title": entry.get("title", {}).get("$t"),
                      "published": entry.get("published", {}).get("$t"),
                      "reason": "Konten Uprealband memuat istilah atau entitas yang berpotensi berkaitan dengan sejarah IEB.",
                      "status": "needs_review"
                  })

          index = json.loads((root / "uprealband-archive-index.json").read_text(encoding="utf-8"))
          if terms.search(json.dumps(index, ensure_ascii=False)):
              candidates.append({
                  "candidate_type": "github_archive_index",
                  "source_url": "https://github.com/uprealband/perjalanan-band-indie/blob/main/archive-index.json",
                  "title": "Uprealband archive-index.json",
                  "reason": "Indeks arsip GitHub Uprealband memuat istilah atau entitas yang berpotensi berkaitan dengan sejarah IEB.",
                  "status": "needs_review"
              })

          head = json.loads(
              (root / "uprealband-github-head.json").read_text(encoding="utf-8")
          ).get("sha")

          payload = {
              "schema_version": "1.0",
              "upstream": {
                  "repository": "uprealband/perjalanan-band-indie",
                  "main_sha": head,
                  "blog_feed": "https://www.uprealband.com/feeds/posts/default?alt=json&max-results=50"
              },
              "candidates": candidates
          }

          out = pathlib.Path("ingest/candidates/uprealband-candidates.json")
          new_text = json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          old_text = out.read_text(encoding="utf-8") if out.exists() else ""

          if new_text != old_text:
              out.write_text(new_text, encoding="utf-8")
              pathlib.Path("ingest/candidates/.changed").write_text("changed\n", encoding="utf-8")
          else:
              out.unlink(missing_ok=True)

      - name: Commit detected source changes
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ingest/candidates/.changed ]; then
            echo "No relevant Uprealband source change."
            rm -rf ingest/tmp
            exit 0
          fi

          rm -f ingest/candidates/.changed
          rm -rf ingest/tmp

          git config user.name "IEB Archive Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/candidates/uprealband-candidates.json
          git commit -m "chore: detect Uprealband source changes"
          git push
